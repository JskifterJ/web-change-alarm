name: Web change alarm

on:
  schedule:
    # UTC. Several early triggers because GitHub's scheduler can be late;
    # the script itself waits until WINDOW_START (Europe/Zurich) and stops at
    # WINDOW_END. The earliest trigger is ~05:17 Zurich, so WINDOW_START must be later.
    - cron: "17 4 * * 1-5"
    - cron: "47 4 * * 1-5"
    - cron: "11 5 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = one check + test email, window = normal run"
        type: choice
        options: [test, window]
        default: test

permissions:
  contents: read
  issues: write

concurrency:
  group: web-change-alarm
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Watch page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode || 'window' }}
          # Set these under Settings > Secrets and variables > Actions > Variables.
          WATCH_UNTIL: ${{ vars.WATCH_UNTIL }}                  # required, e.g. 2026-11-20
          WINDOW_START: ${{ vars.WINDOW_START || '06:30' }}     # Europe/Zurich time
          WINDOW_END: ${{ vars.WINDOW_END || '08:30' }}
          INTERVAL: ${{ vars.INTERVAL || '45' }}
        run: bash cloud/watch.sh
